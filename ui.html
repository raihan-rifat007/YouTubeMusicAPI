<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YTMusic API</title>
<link rel="icon" href="/assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #030303;
    --sb: rgba(6,6,6,0.6);
    --s1: rgba(255,255,255,0.032);
    --s2: rgba(255,255,255,0.058);
    --s3: rgba(255,255,255,0.09);
    --bd: rgba(255,255,255,0.07);
    --bd2: rgba(255,255,255,0.11);
    --bd3: rgba(255,255,255,0.18);
    --tx: #fff;
    --tx2: #e8e8e8;
    --mu: #8f8f8f;
    --di: #404040;
    --fa: rgba(255,255,255,0.04);
    --ac: #fff;
    --ah: #d4d4d4;
    --adim: rgba(255,255,255,0.06);
    --pb: rgba(3,3,3,0.88);
    --t: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    --tt: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    --glass: rgba(255,255,255,0.04);
    --glass-h: rgba(255,255,255,0.07);
    --glow-w: rgba(255,255,255,0.06);
    --blur-s: blur(14px) saturate(1.3);
    --blur-m: blur(28px) saturate(1.4);
    --blur-l: blur(48px) saturate(1.7);
  }

  html,
  body {
    height: 100%;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--tx);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 65% 55% at 8% 12%, rgba(255,255,255,0.028) 0%, transparent 70%),
      radial-gradient(ellipse 50% 60% at 92% 88%, rgba(255,255,255,0.018) 0%, transparent 70%),
      radial-gradient(ellipse 40% 40% at 50% 50%, rgba(255,255,255,0.008) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  ::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  ::-webkit-scrollbar-track {
    background: transparent;
  }

  ::-webkit-scrollbar-thumb {
    background: var(--bd2);
    border-radius: 4px;
    border: 2px solid var(--bg);
  }

  ::-webkit-scrollbar-thumb:hover {
    background: var(--bd3);
  }

  .layout {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  .sb {
    width: 240px;
    min-width: 240px;
    background: rgba(5,5,5,0.62);
    backdrop-filter: var(--blur-m);
    -webkit-backdrop-filter: var(--blur-m);
    border-right: 1px solid rgba(255,255,255,0.07);
    display: flex;
    flex-direction: column;
    padding: 10px;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }

  .sb::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 180px;
    background: radial-gradient(ellipse at top, rgba(255, 255, 255, 0.03), transparent 70%);
    pointer-events: none;
  }

  .slogo {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 10px 22px;
    position: relative;
  }

  .slogo img {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    filter: grayscale(1) brightness(1.3);
    box-shadow: 0 4px 20px rgba(255, 255, 255, 0.08);
    border: 1px solid var(--bd2);
  }

  .sl-tx span {
    display: block;
    font-size: 0.88rem;
    font-weight: 800;
    letter-spacing: 0.3px;
  }

  .sl-tx small {
    color: var(--di);
    font-size: 0.62rem;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    font-weight: 700;
  }

  .ni {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 14px;
    border-radius: 9px;
    cursor: pointer;
    color: var(--mu);
    font-size: 0.82rem;
    font-weight: 600;
    transition: var(--t);
    position: relative;
    overflow: hidden;
  }

  .ni::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 0;
    background: var(--tx);
    border-radius: 0 3px 3px 0;
    transition: height var(--t);
  }

  .ni:hover {
    color: var(--tx);
    background: rgba(255, 255, 255, 0.04);
  }

  .ni.on {
    color: #000;
    background: var(--tx);
    box-shadow: 0 4px 24px rgba(255, 255, 255, 0.15);
  }

  .ni.on::before {
    height: 0;
  }

  .ni svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    flex-shrink: 0;
  }

  .sdiv {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--bd2), transparent);
    margin: 14px 8px;
  }

  .slab {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--di);
    font-weight: 800;
    padding: 0 14px 8px;
  }

  .nps {
    margin-top: auto;
    padding: 12px;
    background: var(--s2);
    border: 1px solid var(--bd2);
    border-radius: 12px;
    display: none;
    cursor: pointer;
    transition: var(--t);
    position: relative;
    overflow: hidden;
  }

  .nps::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), transparent 60%);
    pointer-events: none;
  }

  .nps:hover {
    background: var(--s3);
    border-color: var(--bd3);
    transform: translateY(-2px);
  }

  .nps.show {
    display: block;
  }

  .nps img {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 8px;
    object-fit: cover;
    margin-bottom: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
  }

  .nps-t {
    font-size: 0.76rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.01em;
  }

  .nps-a {
    font-size: 0.68rem;
    color: var(--mu);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .main {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
  }

  .main::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 200px;
    background: radial-gradient(ellipse at top left, rgba(255, 255, 255, 0.035), transparent 60%);
    pointer-events: none;
  }

  .mh {
    padding: 14px 26px 0;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .brand-icon {
    width: 40px;
    height: 40px;
    border-radius: 11px;
    background: var(--s2);
    border: 1px solid var(--bd2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: var(--t);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .brand-icon:hover {
    transform: scale(1.05);
    border-color: var(--bd3);
  }

  .brand-icon img {
    width: 26px;
    height: 26px;
    object-fit: contain;
    filter: grayscale(1) brightness(1.4);
  }

  .brand-tx {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .brand-tx b {
    font-size: 0.82rem;
    font-weight: 800;
    letter-spacing: -0.02em;
  }

  .brand-tx span {
    font-size: 0.62rem;
    color: var(--di);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    margin-top: 1px;
  }

  .msr {
    flex: 1;
    position: relative;
    max-width: 460px;
    margin-left: 6px;
  }

  .msr input {
    width: 100%;
    background: var(--s2);
    border: 1px solid var(--bd);
    padding: 12px 16px 12px 44px;
    border-radius: 12px;
    color: var(--tx);
    font-size: 0.86rem;
    font-family: inherit;
    outline: none;
    transition: var(--t);
  }

  .msr input:focus {
    background: var(--s3);
    border-color: var(--bd3);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.06), 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  .msr input::placeholder {
    color: var(--di);
  }

  .msr .si {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    width: 15px;
    height: 15px;
    stroke: var(--di);
    fill: none;
    stroke-width: 2.5;
    pointer-events: none;
    transition: var(--t);
  }

  .msr input:focus~.si {
    stroke: var(--tx);
  }

  .msr .kbd {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.62rem;
    color: var(--di);
    border: 1px solid var(--bd2);
    padding: 2px 6px;
    border-radius: 5px;
    font-weight: 700;
    font-family: ui-monospace, monospace;
    pointer-events: none;
  }

  .fr {
    display: flex;
    gap: 8px;
    padding: 18px 26px 0;
    flex-wrap: wrap;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }

  .fc {
    padding: 8px 18px;
    border-radius: 20px;
    background: transparent;
    border: 1px solid var(--bd2);
    color: var(--mu);
    font-size: 0.74rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--t);
    font-family: inherit;
    white-space: nowrap;
    letter-spacing: 0.01em;
  }

  .fc:hover {
    border-color: var(--bd3);
    color: var(--tx);
    background: rgba(255, 255, 255, 0.03);
  }

  .fc.on {
    background: var(--tx);
    border-color: var(--tx);
    color: #000;
    box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
  }

  .cnt {
    flex: 1;
    overflow-y: auto;
    padding: 22px 26px 130px;
    min-height: 0;
    position: relative;
    z-index: 1;
  }

  .pane {
    display: none;
    animation: fu 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .pane.show {
    display: block;
  }

  .stit {
    font-size: 1.6rem;
    font-weight: 900;
    margin-bottom: 24px;
    letter-spacing: -0.03em;
    background: linear-gradient(180deg, #fff, #a3a3a3);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .rl {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .rr {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: var(--t);
    position: relative;
    min-width: 0;
    border: 1px solid transparent;
  }

  .rr:hover {
    background: linear-gradient(to right, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
    border-color: var(--bd);
  }

  .rr.on {
    background: linear-gradient(to right, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
    border-color: var(--bd2);
  }

  .rr.on .rr-t {
    color: var(--tx);
    font-weight: 700;
  }

  .rr.on::before {
    content: '';
    position: absolute;
    left: -1px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 55%;
    background: var(--tx);
    border-radius: 0 3px 3px 0;
    box-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
  }

  .rn {
    width: 22px;
    text-align: right;
    font-size: 0.74rem;
    color: var(--di);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
  }

  .rr:hover .rn {
    visibility: hidden;
  }

  .rpl {
    position: absolute;
    left: 14px;
    width: 22px;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .rpl svg {
    width: 13px;
    height: 13px;
    fill: var(--tx);
  }

  .rr:hover .rpl {
    display: flex;
  }

  .rth {
    width: 46px;
    height: 46px;
    border-radius: 9px;
    object-fit: cover;
    background: var(--s2);
    flex-shrink: 0;
    border: 1px solid var(--bd2);
    transition: var(--t);
  }

  .rr:hover .rth {
    border-color: var(--bd3);
    transform: scale(1.03);
  }

  .ri {
    flex: 1;
    min-width: 0;
  }

  .rr-t {
    font-size: 0.875rem;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: -0.01em;
  }

  .rr-s {
    font-size: 0.72rem;
    color: var(--mu);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  .rdu {
    font-size: 0.72rem;
    color: var(--di);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
    font-family: ui-monospace, monospace;
    font-weight: 600;
  }

  .rbg {
    font-size: 0.55rem;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: var(--mu);
    padding: 3px 8px;
    border: 1px solid var(--bd2);
    border-radius: 8px;
    flex-shrink: 0;
    font-weight: 800;
    background: rgba(255, 255, 255, 0.02);
  }

  .ra {
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: var(--t);
    flex-shrink: 0;
  }

  .rr:hover .ra {
    opacity: 1;
  }

  .rb {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: transparent;
    border: none;
    color: var(--mu);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--t);
  }

  .rb:hover {
    color: var(--tx);
    background: rgba(255, 255, 255, 0.1);
  }

  .rb svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
  }

  .emp {
    padding: 90px 24px;
    text-align: center;
    color: var(--di);
  }

  .emp svg {
    width: 54px;
    height: 54px;
    stroke: var(--fa);
    fill: none;
    stroke-width: 1.2;
    margin: 0 auto 20px;
    display: block;
  }

  .emp h3 {
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--mu);
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }

  .emp p {
    font-size: 0.82rem;
    color: var(--di);
  }

  .ld {
    display: none;
    padding: 56px;
    text-align: center;
  }

  .ld span {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--mu);
    margin: 0 3px;
    animation: bounce 1.2s infinite;
  }

  .ld span:nth-child(2) {
    animation-delay: 0.15s;
  }

  .ld span:nth-child(3) {
    animation-delay: 0.3s;
  }

  @keyframes bounce {
    0%,
    60%,
    100% {
      transform: translateY(0);
      opacity: 0.35;
    }
    30% {
      transform: translateY(-9px);
      opacity: 1;
    }
  }

  .eh {
    display: flex;
    gap: 28px;
    align-items: flex-end;
    padding: 44px 0 26px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--bd);
    position: relative;
  }

  .eh::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 80px;
    height: 2px;
    background: var(--tx);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
  }

  .ea {
    width: 180px;
    height: 180px;
    border-radius: 14px;
    object-fit: cover;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--bd2);
    flex-shrink: 0;
  }

  .ea.c {
    border-radius: 14px;
  }

  .ety {
    font-size: 0.64rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 800;
    margin-bottom: 10px;
    color: var(--mu);
  }

  .en {
    font-size: 2.6rem;
    font-weight: 900;
    line-height: 1.05;
    margin-bottom: 12px;
    word-break: break-word;
    letter-spacing: -0.04em;
    background: linear-gradient(180deg, #fff, #999);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .ede {
    font-size: 0.82rem;
    color: var(--mu);
    margin-bottom: 10px;
    max-width: 520px;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .est {
    font-size: 0.76rem;
    color: var(--di);
    font-weight: 600;
  }

  .eac {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 0 24px;
  }

  .pfab {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--tx);
    border: none;
    color: #000;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--t);
    box-shadow: 0 8px 32px rgba(255, 255, 255, 0.2);
  }

  .pfab:hover {
    background: var(--ah);
    transform: scale(1.06) translateY(-2px);
    box-shadow: 0 12px 40px rgba(255, 255, 255, 0.3);
  }

  .pfab svg {
    width: 20px;
    height: 20px;
    fill: currentColor;
  }

  .bb {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 10px 20px;
    background: transparent;
    border: 1px solid var(--bd2);
    border-radius: 22px;
    color: var(--mu);
    font-size: 0.76rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: var(--t);
  }

  .bb:hover {
    border-color: var(--tx);
    color: var(--tx);
    background: rgba(255, 255, 255, 0.03);
  }

  .pb {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 90px;
    background: rgba(3,3,3,0.82);
    backdrop-filter: var(--blur-l);
    -webkit-backdrop-filter: var(--blur-l);
    border-top: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 -12px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
    display: grid;
    grid-template-columns: minmax(160px, 1fr) minmax(280px, 2fr) minmax(160px, 1fr);
    align-items: center;
    gap: 20px;
    padding: 0 20px;
    z-index: 200;
    transform: translateY(100%);
    transition: transform var(--tt);
    box-shadow: 0 -8px 40px rgba(0, 0, 0, 0.6);
  }

  .pb::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.15), transparent);
  }

  .pb.vis {
    transform: translateY(0);
  }

  .pbl {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    overflow: hidden;
  }

  .pbt {
    width: 56px;
    height: 56px;
    border-radius: 9px;
    object-fit: cover;
    background: var(--s2);
    flex-shrink: 0;
    cursor: pointer;
    border: 1px solid var(--bd2);
    transition: var(--t);
  }

  .pbt:hover {
    border-color: var(--bd3);
    transform: scale(1.03);
  }

  .pbi {
    flex: 1;
    min-width: 0;
    overflow: hidden;
  }

  .pbt2 {
    font-size: 0.85rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    letter-spacing: -0.01em;
  }

  .pbt2:hover {
    color: var(--mu);
  }

  .pba {
    font-size: 0.72rem;
    color: var(--mu);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    margin-top: 2px;
  }

  .pba:hover {
    color: var(--tx);
  }

  .ph {
    width: 34px;
    height: 34px;
    border: none;
    background: transparent;
    color: var(--mu);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: var(--t);

  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(s);
    })();

    var songs = [];
    var yt = null;
    var ytOk = false;
    var playing = false;
    var idx = -1;
    var prog = null;
    var shuf = false;
    var rep = 0;
    var liked = new Set();
    var vol = 0.8;
    var muted = false;
    var expanded = false;
    var slyr = [];
    var lyrOk = false;
    var relSongs = [];
    var curNav = 'search';
    var curF = '';
    var lastQ = '';
    var dOk = false;
    var discOk = false;
    var chartOk = false;
    var viewMode = 'grid';
    var dlStates = {};

    function onYouTubeIframeAPIReady() {
      yt = new YT.Player('ytplayer', {
        height: '0',
        width: '0',
        host: 'https://www.youtube-nocookie.com',
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          modestbranding: 1,
          rel: 0
        },
        events: {
          onReady: function () {
            ytOk = true;
            yt.setVolume(vol * 100);
          },
          onStateChange: onSt,
          onError: onErr
        }
      });
    }

    function onSt(e) {
      if (e.data === 1) {
        playing = true;
        setPI(true);
        startP();
      } else if (e.data === 2 || e.data === 0) {
        playing = false;
        setPI(false);
        stopP();
      }
      if (e.data === 0) {
        rep === 2 ? (yt.seekTo(0), yt.playVideo()) : setTimeout(nextSong, 600);
      }
    }

    function onErr() {
      var s = songs[idx];
      if (s && s.fallbackVideoId && !s._fb) {
        s._fb = true;
        yt.loadVideoById(s.fallbackVideoId);
      } else {
        toast('Playback error');
        setTimeout(nextSong, 800);
      }
    }

    function setPI(p) {
      var ic = p
        ? '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>'
        : '<polygon points="5 3 19 12 5 21 5 3"/>';
      g('PBPI').innerHTML = ic;
      g('EPPI').innerHTML = ic;
      g('EART').classList.toggle('pl', p);
    }

    function startP() {
      stopP();
      prog = setInterval(upProg, 300);
    }

    function stopP() {
      if (prog) {
        clearInterval(prog);
        prog = null;
      }
    }

    function upProg() {
      if (!yt || !ytOk) return;
      var c = yt.getCurrentTime() || 0;
      var t = yt.getDuration() || 0;
      var p = t > 0 ? c / t * 100 : 0;
      tx('CUR', fmt(c));
      tx('DUR', fmt(t));

          return ((b.width || 0) > (a.width || 0)) ? b : a;
        }, s.thumbnails[0]);
        if (best && best.url) return best.url;

      return v ? 'https://img.youtube.com/vi/' + v + '/hqdefault.jpg' : '';

    function arStr(s) {

    function dynBg(url) {
      var img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function () {
        try {
          var c = document.createElement('canvas');
          c.width = c.height = 1;
          var ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, 1, 1);
          var d = ctx.getImageData(0, 0, 1, 1).data;
          var l = (d[0] * 0.3 + d[1] * 0.59 + d[2] * 0.11) / 255;
          var v = Math.round(l * 20);
          g('EP').style.background = 'radial-gradient(ellipse at 30% 20%,rgb(' + v + ',' + v + ',' + v + ') 0%,#050505 55%,#000 100%)';
        } catch (x) {}
      };

    }

    function nextSong() {

    async function loadLyr(s) {
      lyrOk = true;
      slyr = [];
      g('LWAIT').style.display = 'block';
      g('LWAIT').textContent = 'Loading lyrics...';
      g('LBODY').innerHTML = '';
      try {
        var d = await (await fetch(
          '/api/lyrics?title=' + encodeURIComponent(s.title || '')
          + '&artist=' + encodeURIComponent(arStr(s))
        )).json();
        g('LWAIT').style.display = 'none';
        if (d.success && d.syncedLyrics) {
          slyr = parseLRC(d.syncedLyrics);
          if (slyr.length) {
            g('LBODY').innerHTML = '<div class="lc">'
              + slyr.map(function (l, i) {
                return '<div class="ll" data-i="' + i + '" onclick="seekLyr(' + i + ')">' + esc(l.text) + '</div>';
              }).join('')
              + '</div>';
          } else if (d.plainLyrics) {
            g('LBODY').innerHTML = '<div class="lp">' + esc(d.plainLyrics) + '</div>';
          } else {
            g('LBODY').innerHTML = '<div class="lw">No lyrics found</div>';
          }
        } else if (d.success && d.plainLyrics) {
          g('LBODY').innerHTML = '<div class="lp">' + esc(d.plainLyrics) + '</div>';
        } else {
          g('LBODY').innerHTML = '<div class="lw">No lyrics found</div>';
        }
      } catch (e) {
        g('LWAIT').style.display = 'none';
        g('LBODY').innerHTML = '<div class="lw">Could not load lyrics</div>';
      }
    }

    function parseLRC(txt) {
      var r = [];
      txt.split('\n').forEach(function (line) {
        var m = line.match(/\[(\d+):(\d+\.?\d*)\](.*)/);
        if (m) {
          var t = parseInt(m[1]) * 60 + parseFloat(m[2]);
          var x = m[3].trim();
          if (x) r.push({ time: t, text: x });
        }
      });
      return r;
    }

    function seekLyr(i) {
      if (yt && ytOk && slyr[i]) yt.seekTo(slyr[i].time, true);

    function hiLyr(ct) {
      var ai = -1;
      for (var i = 0; i < slyr.length; i++) {
        if (slyr[i].time <= ct) ai = i;
        else break;
      }
      document.querySelectorAll('.ll').forEach(function (el, i) {
        el.classList.toggle('on', i === ai);
        el.classList.toggle('ps', i < ai);

    // ── FETCH + BLOB DOWNLOAD ─────────────────────────────────────────────────
    // FIX: anchor-based download lets Chrome override filename with content-type
    // (e.g. saves "song.json" even when a.download="song.mp3" if server sends JSON).
    // fetch() + blob() + createObjectURL() forces the a.download filename always.
    function fetchBlob(url, filename, cb) {
      toast('Starting MP3 download...');
      fetch(url)
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          var ct = res.headers.get('Content-Type') || '';
          if (ct.includes('application/json') || ct.includes('text/html')) {
            throw new Error('Server returned error instead of audio');
          }
          return res.blob();
        })
        .then(function(blob) {
          var burl = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = burl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function() { URL.revokeObjectURL(burl); }, 90000);
          toast('Downloaded: ' + filename);
          if (cb) cb(true);
        })
        .catch(function(err) {
          console.error('Download error:', err);
          toast('Download failed. Try again or check server.');
          if (cb) cb(false);
        });
    }

    function typeCls(type, bid) {
      bid = bid || '';
      if (bid.startsWith('VL') || type === 'playlist') return 't-playlist';
      if ((bid.startsWith('MPRE') && !bid.startsWith('VL')) || type === 'album') return 't-album';
      if (bid.startsWith('UC') || type === 'artist') return 't-artist';
      if (type === 'video') return 't-video';
      return 't-song';
    }

    function typeLabel(type, bid) {
      bid = bid || '';
      if (bid.startsWith('VL') || type === 'playlist') return 'Playlist';
      if ((bid.startsWith('MPRE') && !bid.startsWith('VL')) || type === 'album') return 'Album';
      if (bid.startsWith('UC') || type === 'artist') return 'Artist';
      if (type === 'video') return 'Video';
      return 'Song';
    }

    function rowsGrid(list) {
      return '<div class="gc fu">' + list.map(function (s, i) {
        var type = s.resultType || s.type || 'song';
        var th = thumb(s);
        var ar = arStr(s);
        var bid = s.browseId || '';
        var vi = vid(s);
        var isPl = bid.startsWith('VL') || type === 'playlist';
        var isAl = (bid.startsWith('MPRE') && !isPl) || type === 'album';
        var isAr = bid.startsWith('UC') || type === 'artist';
        var canPlay = !!(vi && (type === 'song' || type === 'video'));
        var clk = '';
        if (canPlay) clk = 'playSong(' + i + ')';
        else if (isPl && bid) clk = "vPl('" + bid + "','" + encodeURIComponent(th) + "','" + encodeURIComponent(s.title || '') + "')";
        else if (isAl && bid) clk = "vAl('" + bid + "','" + encodeURIComponent(th) + "','" + encodeURIComponent(s.title || '') + "')";
        else if (bid) clk = "vAr('" + bid + "','" + encodeURIComponent(th) + "','" + encodeURIComponent(s.title || '') + "')";
        var tc = typeCls(type, bid);
        var tl = typeLabel(type, bid);
        var isLiked = vi && liked.has(vi);
        return '<div class="gcard' + (i === idx ? ' on' : '') + '" onclick="' + clk + '">'
          + '<div class="gct">'
          + '<img src="' + th + '" loading="lazy" decoding="async" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src=this.src.replace(\'hqdefault\',\'mqdefault\');}else{this.style.opacity=\'0\';}" style="image-rendering:auto">'
          + '<div class="gct-ov">'
          + (canPlay
            ? '<button class="gplay" onclick="event.stopPropagation();playSong(' + i + ')">'
              + '<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>'
              + '</button>'
            : '')
          + '</div>'
          + (s.duration ? '<span class="gdur">' + esc(s.duration) + '</span>' : '')
          + '<span class="gtyp ' + tc + '">' + tl + '</span>'
          + '</div>'
          + '<div class="ginfo">'
          + '<div class="gttl">' + esc(s.title || s.name || 'Unknown') + '</div>'
          + '<div class="gart">' + esc(ar || tl) + '</div>'
          + '</div>'
          + (canPlay
            ? '<div class="gacts">'
              + '<button class="gab" data-i="' + i + '" onclick="event.stopPropagation();dlRowGrid(' + i + ')">'
              + '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>MP3'
              + '</button>'
              + '<button class="glike' + (isLiked ? ' on' : '') + '" data-vi="' + (vi || '') + '" onclick="event.stopPropagation();toggleLikeById(\'' + (vi || '') + '\')">'
              + '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'
              + '</button>'
              + '</div>'
            : '')
          + '</div>';
      }).join('') + '</div>';
    }

    function rowsH(list) {
      return list.map(function (s, i) {
        var type = s.resultType || s.type || 'song';
        var th = thumb(s);
        var ar = arStr(s);
        var bid = s.browseId || '';
        var isPl = bid.startsWith('VL') || type === 'playlist';
        var isAl = (bid.startsWith('MPRE') && !isPl) || type === 'album';
        var isAr = bid.startsWith('UC') || type === 'artist';
        var vi = vid(s);
        var canPlay = !!(vi && (type === 'song' || type === 'video'));
        var clk = '';
        if (canPlay) clk = 'playSong(' + i + ')';
        else if (isPl && bid) clk = "vPl('" + bid + "','" + encodeURIComponent(th) + "','" + encodeURIComponent(s.title || '') + "')";
        else if (isAl && bid) clk = "vAl('" + bid + "','" + encodeURIComponent(th) + "','" + encodeURIComponent(s.title || '') + "')";
        else if (bid) clk = "vAr('" + bid + "','" + encodeURIComponent(th) + "','" + encodeURIComponent(s.title || '') + "')";
        var badge = (type !== 'song' && type !== 'video')
          ? '<span class="rbg">' + esc(type) + '</span>'
          : '';
        return '<div class="rr' + (i === idx ? ' on' : '') + '" onclick="' + clk + '">'
          + '<div class="rn">' + (i + 1) + '</div>'
          + '<div class="rpl"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>'
          + '<img class="rth" src="' + th + '" loading="lazy">'
          + '<div class="ri"><div class="rr-t">' + esc(s.title || s.name || 'Unknown') + '</div><div class="rr-s">' + esc(ar || type) + '</div></div>'
          + badge
          + '<div class="rdu">' + esc(s.duration || '') + '</div>'
          + (canPlay
            ? '<div class="ra"><button class="rb" onclick="event.stopPropagation();dlRow(' + i + ')" title="Download"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button></div>'
            : '')
          + '</div>';
      }).join('');
    }

    async function vAr(id, thE, nE) {
      var th = decodeURIComponent(thE);
      var name = decodeURIComponent(nE);
      setLd(true);
      try {
        var d = await (await fetch('/api/artists/' + encodeURIComponent(id))).json();
        var tracks = [];
        if (d.topSongs) {
          d.topSongs.forEach(function (s) {
            tracks.push(Object.assign({}, s, {
              resultType: 'song',
              thumbnails: [{ url: s.thumbnail || th }]
            }));
          });
        }
        if (d.songs && d.songs.results) {
          d.songs.results.forEach(function (s) {
            tracks.push(Object.assign({}, s, { resultType: 'song' }));
          });
        }
        if (d.albums) {
          d.albums.forEach(function (a) {
            tracks.push(Object.assign({}, a, {
              resultType: 'album',
              thumbnails: [{ url: a.thumbnail || th }]
            }));
          });
        }
        songs = tracks;
        var art = d.artist || d;
        var rt = th || art.thumbnail || '';
        g('RES').innerHTML = eHdr('Artist', name, rt, '', art.subscribers || '', true)
          + '<div class="rl fu">' + rowsH(tracks) + '</div>';
      } catch (e) {
        setErr('Failed to load artist');
      }
      setLd(false);
    }

    async function vAl(id, thE, nE) {
      var th = decodeURIComponent(thE);
      var name = decodeURIComponent(nE);
      setLd(true);
      try {
        var d = await (await fetch('/api/albums/' + encodeURIComponent(id))).json();
        var al = d.album || d;
        var alTh = th || al.thumbnail || '';
        var alN = name || al.title || 'Album';
        var ar = (d.artist && d.artist.name)
          || (al.artists && al.artists.map(function (a) { return a.name; }).join(', '))
          || '';
        songs = (d.tracks || []).map(function (t) {
          return Object.assign({}, t, {
            resultType: 'song',
            thumbnails: [{ url: alTh }]
          });
        });
        g('RES').innerHTML = eHdr(
          'Album',
          alN,
          alTh,
          ar,
          (al.year || '') + ' · ' + (al.trackCount || songs.length) + ' tracks',
          false
        ) + '<div class="rl fu">' + rowsH(songs) + '</div>';
      } catch (e) {
        setErr('Failed to load album');
      }
      setLd(false);
    }

    async function vPl(id, thE, nE) {
      var th = decodeURIComponent(thE);
      var name = decodeURIComponent(nE);
      setLd(true);
      try {
        var pid = id.startsWith('VL') ? id.substring(2) : id;
        var d = await (await fetch('/api/playlists/' + encodeURIComponent(pid))).json();
        var plTh = th || d.thumbnail || '';
        var plN = name || d.title || 'Playlist';
        songs = (d.tracks || []).map(function (t) {
          return Object.assign({}, t, { resultType: 'song' });
        });
        g('RES').innerHTML = eHdr(
          'Playlist',
          plN,
          plTh,
          d.description || '',
          (d.trackCount || songs.length) + ' tracks',
          false
        ) + '<div class="rl fu">' + rowsH(songs) + '</div>';
      } catch (e) {
        setErr('Failed to load playlist');
      }
      setLd(false);
    }

    function eHdr(type, name, th, desc, stat, circle) {
      return '<div class="eh">'
        + '<img class="ea" src="' + th + '">'
        + '<div>'
        + '<div class="ety">' + esc(type) + '</div>'
        + '<div class="en">' + esc(name) + '</div>'
        + (desc ? '<div class="ede">' + esc(desc) + '</div>' : '')
        + (stat ? '<div class="est">' + esc(stat) + '</div>' : '')
        + '</div></div>'
        + '<div class="eac">'
        + '<button class="pfab" onclick="songs.length&&playSong(0)"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>'
        + '<button class="bb" onclick="goBack()">&#8592; Back</button>'
        + '</div>';
    }

    function goBack() {
      lastQ ? doSearch(lastQ, curF) : showEmp();
    }

    function setLd(v) {
      g('LD').style.display = v ? 'block' : 'none';
      if (v) g('RES').innerHTML = '';
    }

    function setErr(m) {
      g('RES').innerHTML = '<div class="emp">'
        + '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
        + '<h3>Error</h3>'
        + '<p>' + esc(m) + '</p>'
        + '</div>';
    }

    async function loadDiscover() {
      discOk = true;
      g('pane-discover').innerHTML = '<div class="ld" style="display:block"><span></span><span></span><span></span></div>';
      try {
        var d = await (await fetch('/api/home')).json();
        var secs = d.data || d.results || d.content || [];
        var h = '<div class="stit">Discover</div>';
        var localSongs = [];
        secs.slice(0, 4).forEach(function (sec) {
          if (sec.title) {
            h += '<div style="font-size:.66rem;text-transform:uppercase;letter-spacing:1.8px;color:var(--mu);font-weight:800;margin:20px 0 12px">' + esc(sec.title) + '</div>';
          }
          var tr = (sec.contents || []).filter(function (x) {
            return vid(x) || x.browseId;
          });
          if (tr.length) {
            var base = localSongs.length;
            tr.forEach(function (t, i) {
              t._gi = base + i;
              localSongs.push(t);
            });
            h += '<div class="rl">' + rowsH(tr) + '</div>';
          }
        });
        songs = localSongs;
        g('pane-discover').innerHTML = h || '<div class="emp"><h3>Nothing to discover</h3></div>';
      } catch (e) {
        g('pane-discover').innerHTML = '<div class="emp"><h3>Could not load</h3></div>';
      }
    }

    async function loadCharts() {
      chartOk = true;
      g('pane-charts').innerHTML = '<div class="ld" style="display:block"><span></span><span></span><span></span></div>';
      try {
        var d = await (await fetch('/api/charts?country=US')).json();
        var tr = d.songs || d.results || d.data || [];
        songs = tr;
        g('pane-charts').innerHTML = '<div class="stit">Top Charts</div>'
          + '<div class="rl fu">' + rowsH(tr) + '</div>';
      } catch (e) {
        g('pane-charts').innerHTML = '<div class="emp"><h3>Could not load charts</h3></div>';
      }
    }

    var apiCfg = {
      search: {
        i: [
          { n: 'q', p: 'Query', v: 'coldplay' },
          { n: 'filter', p: 'Filter (songs/albums/artists)', v: 'songs' }
        ],
        u: '/api/search'
      },
      stream: { i: [{ n: 'id', p: 'Video ID', v: 'dQw4w9WgXcQ' }], u: '/api/stream' },
      download: {
        i: [
          { n: 'id', p: 'Video ID', v: 'dQw4w9WgXcQ' },
          { n: 'title', p: 'Title', v: 'My Song' }
        ],
        u: '/api/download'
      },
      lyrics: {
        i: [
          { n: 'title', p: 'Title', v: 'Yellow' },
          { n: 'artist', p: 'Artist', v: 'Coldplay' }
        ],
        u: '/api/lyrics'
      },
      song: { i: [{ n: 'videoId', p: 'Video ID', v: 'dQw4w9WgXcQ' }], u: '/api/songs/{videoId}' },
      album: { i: [{ n: 'browseId', p: 'Album ID', v: 'MPREb_PvMNqFUp1oW' }], u: '/api/albums/{browseId}' },
      artist: { i: [{ n: 'browseId', p: 'Artist ID', v: 'UCIaFw5VBEK8qaW6nRpx_qnw' }], u: '/api/artists/{browseId}' },
      playlist: { i: [{ n: 'playlistId', p: 'Playlist ID', v: 'RDCLAK5uy_k' }], u: '/api/playlists/{playlistId}' },
      charts: { i: [{ n: 'country', p: 'Country', v: 'US' }], u: '/api/charts' },
      related: { i: [{ n: 'id', p: 'Video ID', v: 'dQw4w9WgXcQ' }], u: '/api/related/{id}' }
    };

    var epL = [
      { m: 'GET', p: '/api/search', q: '?q=coldplay&filter=songs' },
      { m: 'GET', p: '/api/stream', q: '?id=VIDEO_ID' },
      { m: 'GET', p: '/api/download', q: '?id=VIDEO_ID&title=Song+Name' },
      { m: 'GET', p: '/api/proxy', q: '?url=AUDIO_URL' },
      { m: 'GET', p: '/api/lyrics', q: '?title=Yellow&artist=Coldplay' },
      { m: 'GET', p: '/api/songs/{videoId}', q: '' },
      { m: 'GET', p: '/api/albums/{browseId}', q: '' },
      { m: 'GET', p: '/api/artists/{browseId}', q: '' },
      { m: 'GET', p: '/api/playlists/{playlistId}', q: '' },
      { m: 'GET', p: '/api/charts', q: '?country=US' },
      { m: 'GET', p: '/api/related/{id}', q: '' },
      { m: 'GET', p: '/api/home', q: '' },
      { m: 'GET', p: '/api/music/find', q: '?name=Yellow&artist=Coldplay' },
      { m: 'GET', p: '/health', q: '' }
    ];

    function renderAPI() {
      var h = '<div class="api-wrap">'
        + '<div class="api-sec">'
        + '<div class="api-tit">Test Endpoints</div>'
        + '<div class="api-row"><select class="api-sel" id="APIEP" onchange="apiUpI()">'
        + Object.keys(apiCfg).map(function (k) {
          return '<option>' + k + '</option>';
        }).join('')
        + '</select></div>'
        + '<div id="APII" class="api-row"></div>'
        + '<div class="api-url" id="APIU"></div>'
        + '<button class="api-btn" onclick="apiTest()">Send Request</button>'
        + '<div class="api-res" id="APIRES"><pre id="APIPRE"></pre></div>'
        + '</div>'
        + '<div class="api-sec">'
        + '<div class="api-tit">All Endpoints</div>'
        + '<div class="ep-list">'
        + epL.map(function (ep, i) {
          return '<div class="ep-row">'
            + '<span class="ep-m">' + ep.m + '</span>'
            + '<span class="ep-p">' + ep.p.replace(/\{([^}]+)\}/g, '<span class="pm">{$1}</span>') + esc(ep.q) + '</span>'
            + '<button class="ep-cp" id="ec' + i + '" onclick="cpEp(\'' + ep.p + ep.q + '\',\'ec' + i + '\')">'
            + '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>'
            + '</button>'
            + '</div>';
        }).join('')
        + '</div></div></div>';
      g('pane-api').innerHTML = h;
      apiUpI();
    }

    function apiUpI() {
      var ep = g('APIEP').value;
      var c = apiCfg[ep];
      g('APII').innerHTML = c.i.map(function (x) {
        return '<input class="api-in" id="ai_' + x.n + '" placeholder="' + x.p + '" value="' + x.v + '" oninput="apiUpU()">';
      }).join('');
      apiUpU();
    }

    function apiUpU() {
      var ep = g('APIEP').value;
      var c = apiCfg[ep];
      var url = c.u;
      var p = new URLSearchParams();
      c.i.forEach(function (x) {
        var el = g('ai_' + x.n);
        var v = el ? el.value : x.v;
        if (v) {
          if (url.includes('{' + x.n + '}')) {
            url = url.replace('{' + x.n + '}', encodeURIComponent(v));
          } else {
            p.append(x.n, v);
          }
        }
      });
      var qs = p.toString();
      if (qs) url += '?' + qs;
      g('APIU').textContent = 'GET ' + url;
    }

    async function apiTest() {
      var ep = g('APIEP').value;
      var c = apiCfg[ep];
      var url = c.u;
      var p = new URLSearchParams();
      c.i.forEach(function (x) {
        var el = g('ai_' + x.n);
        var v = el ? el.value : x.v;
        if (v) {
          if (url.includes('{' + x.n + '}')) {
            url = url.replace('{' + x.n + '}', encodeURIComponent(v));
          } else {
            p.append(x.n, v);
          }
        }
      });
      var qs = p.toString();
      if (qs) url += '?' + qs;
      g('APIRES').style.display = 'block';
      g('APIPRE').textContent = 'Loading...';
      if (ep === 'download') {
        toast('Download triggered');
        var a = document.createElement('a');
        a.href = url;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        g('APIPRE').textContent = 'Download triggered.';
        return;
      }
      try {
        var d = await (await fetch(url)).json();
        g('APIPRE').textContent = JSON.stringify(d, null, 2);
      } catch (e) {
        g('APIPRE').textContent = 'Error: ' + e.message;
      }
    }

    function cpEp(path, id) {
      navigator.clipboard.writeText(location.origin + path).then(function () {
        var el = g(id);
        el.classList.add('ok');
        setTimeout(function () {
          el.classList.remove('ok');
        }, 2000);
      });
    }

    function toast(msg) {
      var t = g('TOAST');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._t);
      t._t = setTimeout(function () {
        t.classList.remove('show');
      }, 2500);
    }

    function esc(s) {
      var d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }

    window.onerror = function () {
      return true;
    };

    window.onunhandledrejection = function (e) {
      e.preventDefault();
    };
  </script>
</body>
</html>
