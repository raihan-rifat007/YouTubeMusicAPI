<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YTMusic API</title>
<link rel="icon" href="/assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#000;--sb:#0a0a0a;--s1:#111;--s2:#181818;--s3:#242424;--bd:#2a2a2a;--tx:#fff;--mu:#b3b3b3;--di:#535353;--ac:#1db954;--ah:#1ed760;--adim:rgba(29,185,84,.12);--pb:#121212;--t:.2s ease}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;display:flex;flex-direction:column}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--di);border-radius:3px}
.layout{display:flex;flex:1;overflow:hidden}
.sb{width:256px;min-width:256px;background:var(--sb);display:flex;flex-direction:column;padding:8px;overflow:hidden}
.slogo{display:flex;align-items:center;gap:12px;padding:16px 12px 20px}
.slogo img{width:32px;height:32px;border-radius:6px}
.sl-tx span{display:block;font-size:.9rem;font-weight:700}
.sl-tx small{color:var(--mu);font-size:.68rem}
.ni{display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:6px;cursor:pointer;color:var(--mu);font-size:.82rem;font-weight:600;transition:var(--t)}
.ni:hover{color:var(--tx);background:rgba(255,255,255,.05)}
.ni.on{color:var(--tx)}
.ni svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0}
.sdiv{height:1px;background:var(--bd);margin:8px 0}
.nps{margin-top:auto;padding:12px;background:var(--s2);border-radius:8px;display:none;cursor:pointer}
.nps.show{display:block}
.nps img{width:100%;aspect-ratio:1;border-radius:6px;object-fit:cover;margin-bottom:10px}
.nps-t{font-size:.76rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nps-a{font-size:.7rem;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.main{flex:1;overflow:hidden;display:flex;flex-direction:column}
.mh{padding:14px 24px 0;display:flex;align-items:center;gap:12px;flex-shrink:0}
.narr{display:flex;gap:6px}
.nb{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.7);border:none;color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--t)}
.nb:hover{color:var(--tx)}
.nb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5}
.msr{flex:1;position:relative;max-width:420px}
.msr input{width:100%;background:var(--s2);border:none;padding:10px 16px 10px 42px;border-radius:24px;color:var(--tx);font-size:.875rem;font-family:inherit;outline:none;transition:var(--t)}
.msr input:focus{background:var(--s3);box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.msr input::placeholder{color:var(--di)}
.msr .si{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--di);fill:none;stroke-width:2.5}
.fr{display:flex;gap:8px;padding:14px 24px 0;flex-wrap:wrap;flex-shrink:0}
.fc{padding:7px 16px;border-radius:20px;background:var(--s2);border:none;color:var(--tx);font-size:.76rem;font-weight:600;cursor:pointer;transition:var(--t);font-family:inherit;white-space:nowrap}
.fc:hover{background:var(--s3)}
.fc.on{background:var(--ac);color:#000}
.cnt{flex:1;overflow-y:auto;padding:16px 24px 0}
.pane{display:none}.pane.show{display:block}
.stit{font-size:1.4rem;font-weight:700;margin-bottom:20px}
.rl{display:flex;flex-direction:column;gap:1px}
.rr{display:flex;align-items:center;gap:14px;padding:8px 16px;border-radius:6px;cursor:pointer;transition:var(--t);position:relative}
.rr:hover{background:rgba(255,255,255,.07)}
.rr.on .rr-t{color:var(--ac)}
.rr.on{background:var(--adim)}
.rn{width:20px;text-align:right;font-size:.8rem;color:var(--mu);flex-shrink:0}
.rr:hover .rn{visibility:hidden}
.rpl{position:absolute;left:16px;width:20px;display:none;align-items:center;justify-content:center}
.rpl svg{width:14px;height:14px;fill:var(--tx)}
.rr:hover .rpl{display:flex}
.rth{width:44px;height:44px;border-radius:4px;object-fit:cover;background:var(--s2);flex-shrink:0}
.rth.c{border-radius:50%}
.ri{flex:1;min-width:0}
.rr-t{font-size:.875rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rr-s{font-size:.72rem;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.rdu{font-size:.74rem;color:var(--di);font-variant-numeric:tabular-nums;flex-shrink:0}
.rbg{font-size:.58rem;text-transform:uppercase;color:var(--di);padding:2px 7px;border:1px solid var(--bd);border-radius:10px;flex-shrink:0}
.ra{display:flex;gap:4px;opacity:0;transition:var(--t);flex-shrink:0}
.rr:hover .ra{opacity:1}
.rb{width:28px;height:28px;border-radius:50%;background:transparent;border:none;color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--t)}
.rb:hover{color:var(--tx);background:rgba(255,255,255,.1)}
.rb svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.emp{padding:60px 24px;text-align:center;color:var(--di)}
.emp svg{width:56px;height:56px;stroke:var(--di);fill:none;stroke-width:1;margin:0 auto 16px;display:block}
.emp h3{font-size:1.1rem;font-weight:700;color:var(--mu);margin-bottom:8px}
.emp p{font-size:.82rem}
.ld{display:none;padding:48px;text-align:center}
.ld span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mu);margin:0 3px;animation:bounce 1.2s infinite}
.ld span:nth-child(2){animation-delay:.2s}
.ld span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}
.eh{display:flex;gap:24px;align-items:flex-end;padding:48px 0 24px;margin-bottom:20px}
.ea{width:180px;height:180px;border-radius:10px;object-fit:cover;box-shadow:0 20px 60px rgba(0,0,0,.6);flex-shrink:0}
.ea.c{border-radius:50%}
.ety{font-size:.68rem;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-bottom:8px;color:var(--mu)}
.en{font-size:2.6rem;font-weight:900;line-height:1.1;margin-bottom:10px;word-break:break-word}
.ede{font-size:.82rem;color:var(--mu);margin-bottom:8px;max-width:500px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.est{font-size:.78rem;color:var(--mu)}
.eac{display:flex;align-items:center;gap:16px;padding:16px 0}
.pfab{width:54px;height:54px;border-radius:50%;background:var(--ac);border:none;color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--t)}
.pfab:hover{background:var(--ah);transform:scale(1.05)}
.pfab svg{width:22px;height:22px;fill:currentColor}
.bb{display:flex;align-items:center;gap:6px;padding:8px 18px;background:transparent;border:1px solid var(--mu);border-radius:20px;color:var(--mu);font-size:.78rem;font-weight:600;font-family:inherit;cursor:pointer;transition:var(--t)}
.bb:hover{border-color:var(--tx);color:var(--tx)}
.pb{position:fixed;bottom:0;left:0;right:0;height:90px;background:var(--pb);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:16px;z-index:200;transform:translateY(100%);transition:transform .35s cubic-bezier(.4,0,.2,1)}
.pb.vis{transform:translateY(0)}
.pbl{display:flex;align-items:center;gap:14px;width:280px;flex-shrink:0;min-width:0}
.pbt{width:56px;height:56px;border-radius:4px;object-fit:cover;background:var(--s2);flex-shrink:0;cursor:pointer}
.pbi{flex:1;min-width:0}
.pbt2{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pbt2:hover{text-decoration:underline}
.pba{font-size:.73rem;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.pba:hover{text-decoration:underline;color:var(--tx)}
.ph{width:32px;height:32px;border:none;background:transparent;color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--t)}
.ph:hover{color:var(--tx)}.ph.on{color:var(--ac)}
.ph svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.ph.on svg{fill:currentColor}
.pbc{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.pcc{display:flex;align-items:center;gap:8px}
.pc{width:32px;height:32px;border-radius:50%;background:transparent;border:none;color:var(--mu);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--t)}
.pc:hover{color:var(--tx);transform:scale(1.1)}.pc.on{color:var(--ac)}
.pc svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.pc.on svg{fill:currentColor}
.pp{width:40px;height:40px;border-radius:50%;background:var(--tx);border:none;color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--t)}
.pp:hover{transform:scale(1.08)}
.pp svg{width:17px;height:17px;fill:currentColor;stroke:none}
.pg{display:flex;align-items:center;gap:10px;width:100%}
.pt{font-size:.68rem;color:var(--di);font-variant-numeric:tabular-nums;font-family:'SF Mono',monospace;flex-shrink:0}
.pgb{flex:1;height:4px;background:var(--s3);border-radius:2px;cursor:pointer;position:relative}
.pgf{height:100%;background:var(--mu);border-radius:2px;transition:width .1s linear;position:relative;pointer-events:none}
.pgf::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:var(--tx);opacity:0;transition:var(--t)}
.pgb:hover .pgf::after{opacity:1}
.pgb:hover .pgf{background:var(--ac)}
.pbr{display:flex;align-items:center;gap:8px;width:240px;flex-shrink:0;justify-content:flex-end}
.vb{width:80px;height:4px;background:var(--s3);border-radius:2px;cursor:pointer;position:relative}
.vf{height:100%;background:var(--mu);border-radius:2px}
.vb:hover .vf{background:var(--ac)}
.ep{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460,#1a1a2e)}
.ep.open{transform:translateY(0)}
.eph{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;flex-shrink:0}
.epc{width:40px;height:40px;border:none;background:rgba(255,255,255,.1);border-radius:50%;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--t)}
.epc:hover{background:rgba(255,255,255,.2)}
.epc svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.epl{font-size:.72rem;text-transform:uppercase;letter-spacing:2px;color:rgba(255,255,255,.5);font-weight:700}
.epb{flex:1;display:flex;gap:40px;padding:0 56px;overflow:hidden}
.eple{display:flex;flex-direction:column;justify-content:center;align-items:center;width:360px;flex-shrink:0}
.epas{width:290px;height:290px;border-radius:16px;object-fit:cover;box-shadow:0 40px 80px rgba(0,0,0,.6);transition:transform .3s ease}
.epas.pl{transform:scale(1.04)}
.epin{width:290px;margin-top:22px}
.ept{font-size:1.4rem;font-weight:800;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epar{font-size:.9rem;color:rgba(255,255,255,.65);cursor:pointer}
.epar:hover{text-decoration:underline;color:#fff}
.epct{width:290px;margin-top:18px}
.eppr{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.epbar{flex:1;height:5px;background:rgba(255,255,255,.2);border-radius:3px;cursor:pointer}
.epbar:hover .epf{background:var(--ac)}
.epf{height:100%;background:rgba(255,255,255,.75);border-radius:3px;transition:width .1s linear;position:relative}
.epf::after{content:'';position:absolute;right:-7px;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:#fff;opacity:0;transition:var(--t)}
.epbar:hover .epf::after{opacity:1}
.eptm{font-size:.7rem;color:rgba(255,255,255,.45);font-family:'SF Mono',monospace}
.epbn{display:flex;align-items:center;justify-content:space-between}
.ebtn{width:44px;height:44px;border:none;background:transparent;color:rgba(255,255,255,.65);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:var(--t)}
.ebtn:hover{color:#fff;background:rgba(255,255,255,.1)}.ebtn.on{color:var(--ac)}
.ebtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2}
.ebtn.on svg{fill:currentColor}
.epbig{width:60px;height:60px;border-radius:50%;background:#fff;border:none;color:#000;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--t)}
.epbig:hover{transform:scale(1.08)}
.epbig svg{width:24px;height:24px;fill:currentColor;stroke:none}
.epacts{display:flex;gap:10px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.epact{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.1);border:none;color:rgba(255,255,255,.8);font-size:.74rem;font-weight:600;font-family:inherit;cursor:pointer;transition:var(--t)}
.epact:hover{background:rgba(255,255,255,.2);color:#fff}
.epact svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2}
.epact.dl{color:var(--ac)}
.epri{flex:1;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.eptbs{display:flex;gap:4px;margin-bottom:18px;flex-shrink:0}
.etb{padding:8px 20px;border-radius:20px;background:transparent;border:none;color:rgba(255,255,255,.45);font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;transition:var(--t)}
.etb.on{background:rgba(255,255,255,.15);color:#fff}
.etbc{flex:1;overflow-y:auto}
.etpan{display:none}.etpan.on{display:block}
.lc{padding-right:12px}
.ll{font-size:1.4rem;font-weight:700;line-height:1.65;color:rgba(255,255,255,.22);cursor:pointer;padding:3px 0;transition:color .4s ease,font-size .3s ease}
.ll.on{color:#fff;font-size:1.7rem}
.ll.ps{color:rgba(255,255,255,.42)}
.ll:hover{color:rgba(255,255,255,.6)}
.lw{padding:40px;text-align:center;color:rgba(255,255,255,.35);font-size:.83rem}
.lp{font-size:.87rem;line-height:2.1;color:rgba(255,255,255,.65);white-space:pre-wrap}
.qi{display:flex;align-items:center;gap:12px;padding:7px 0;cursor:pointer;border-radius:6px;transition:var(--t)}
.qi:hover{padding:7px 10px;margin:0 -10px;background:rgba(255,255,255,.07)}
.qi.on .qit{color:var(--ac)}
.qin{width:22px;text-align:right;font-size:.78rem;color:rgba(255,255,255,.3)}
.qit2{width:40px;height:40px;border-radius:4px;object-fit:cover;background:rgba(255,255,255,.1);flex-shrink:0}
.qii{flex:1;min-width:0}
.qit{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qis{font-size:.7rem;color:rgba(255,255,255,.38);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qid{font-size:.7rem;color:rgba(255,255,255,.3);font-family:'SF Mono',monospace}
.toast{position:fixed;bottom:108px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--s3);color:var(--tx);padding:10px 20px;border-radius:20px;font-size:.8rem;font-weight:600;z-index:500;opacity:0;transition:all .3s ease;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.api-wrap{padding:0 0 24px}
.api-sec{background:var(--s2);border-radius:8px;padding:18px;margin-bottom:14px}
.api-tit{font-size:.73rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--mu);margin-bottom:14px}
.api-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.api-in{flex:1;min-width:140px;background:var(--s3);border:1px solid var(--bd);padding:9px 13px;border-radius:6px;color:var(--tx);font-size:.82rem;font-family:inherit;outline:none;transition:var(--t)}
.api-in:focus{border-color:rgba(255,255,255,.3)}
.api-sel{background:var(--s3);border:1px solid var(--bd);padding:9px 13px;border-radius:6px;color:var(--tx);font-size:.82rem;font-family:inherit;outline:none;cursor:pointer}
.api-btn{padding:9px 20px;border-radius:6px;background:var(--ac);border:none;color:#000;font-size:.82rem;font-weight:700;font-family:inherit;cursor:pointer;transition:var(--t)}
.api-btn:hover{background:var(--ah)}
.api-url{font-family:'SF Mono',monospace;font-size:.7rem;color:var(--mu);padding:9px 13px;background:var(--bg);border-radius:6px;margin-bottom:10px;border:1px solid var(--bd);word-break:break-all}
.api-res{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:14px;max-height:280px;overflow:auto;margin-top:10px;display:none}
.api-res pre{font-family:'SF Mono',monospace;font-size:.67rem;color:#a8ff78;white-space:pre-wrap;word-break:break-all;margin:0}
.ep-list{display:flex;flex-direction:column;gap:4px}
.ep-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);border-radius:6px;border:1px solid var(--bd);transition:var(--t)}
.ep-row:hover{border-color:var(--mu)}
.ep-m{font-size:.6rem;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--adim);color:var(--ac);min-width:36px;text-align:center;font-family:monospace}
.ep-p{font-family:'SF Mono',monospace;font-size:.74rem;flex:1;color:var(--tx);word-break:break-all}
.ep-p .pm{color:var(--mu)}
.ep-cp{width:26px;height:26px;border:none;background:var(--s3);border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--t);flex-shrink:0}
.ep-cp:hover{background:var(--bd)}
.ep-cp svg{width:12px;height:12px;stroke:var(--mu);fill:none;stroke-width:2}
.ep-cp.ok svg{stroke:var(--ac)}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fu{animation:fu .3s ease}
@media(max-width:900px){.sb{display:none}.epb{flex-direction:column;padding:0 20px}.eple{width:100%;flex-shrink:1}.epas{width:200px;height:200px}.ept{font-size:1.1rem}.pbl{width:auto;min-width:0}.pbr{display:none}}
</style>
</head>
<body>
<div class="layout">
  <div class="sb">
    <div class="slogo">
      <img src="/assets/logo.png" alt="logo">
      <div class="sl-tx"><span>YTMusic</span><small>API v2.1</small></div>
    </div>
    <div class="ni on" id="nav-search" onclick="setNav('search')">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>Search
    </div>
    <div class="ni" id="nav-discover" onclick="setNav('discover')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Discover
    </div>
    <div class="ni" id="nav-charts" onclick="setNav('charts')">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>Charts
    </div>
    <div class="ni" id="nav-api" onclick="setNav('api')">
      <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>API Docs
    </div>
    <div class="sdiv"></div>
    <div class="nps" id="npsSidebar" onclick="toggleExpand()">
      <img id="npsImg" src="">
      <div class="nps-t" id="npsTitle">-</div>
      <div class="nps-a" id="npsArt">-</div>
    </div>
  </div>
  <div class="main">
    <div class="mh">
      <div class="narr">
        <button class="nb" onclick="history.back()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button class="nb" onclick="history.forward()"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
      <div class="msr">
        <svg class="si" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="SI" placeholder="Search songs, artists, albums..." autocomplete="off">
      </div>
    </div>
    <div class="fr">
      <button class="fc on" data-f="" onclick="setFilter(this)">All</button>
      <button class="fc" data-f="songs" onclick="setFilter(this)">Songs</button>

          </button>

          </button>

<div class="toast" id="TOAST"></div>
<div id="ytplayer" style="display:none;position:fixed;bottom:-999px"></div>

<script>
(function(){var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);})();

var songs=[],yt=null,ytOk=false,playing=false,idx=-1,prog=null;
var shuf=false,rep=0,liked=new Set(),vol=0.8,muted=false;
var expanded=false,slyr=[],lyrOk=false,relSongs=[];
var curNav='search',curF='',lastQ='';
var dOk=false,discOk=false,chartOk=false;

function onYouTubeIframeAPIReady(){
  yt=new YT.Player('ytplayer',{
    height:'0',width:'0',
    host:'https://www.youtube-nocookie.com',
    playerVars:{autoplay:0,controls:0,disablekb:1,fs:0,modestbranding:1,rel:0},
    events:{onReady:function(){ytOk=true;yt.setVolume(vol*100);},onStateChange:onSt,onError:onErr}
  });
}

function onSt(e){
  if(e.data===1){playing=true;setPI(true);startP();}
  else if(e.data===2||e.data===0){playing=false;setPI(false);stopP();}
  if(e.data===0){rep===2?(yt.seekTo(0),yt.playVideo()):setTimeout(nextSong,600);}
}
function onErr(){
  var s=songs[idx];
  if(s&&s.fallbackVideoId&&!s._fb){s._fb=true;yt.loadVideoById(s.fallbackVideoId);}
  else{toast('Playback error');setTimeout(nextSong,800);}
}
function setPI(p){
  var ic=p?'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>':'<polygon points="5 3 19 12 5 21 5 3"/>';
  g('PBPI').innerHTML=ic;g('EPPI').innerHTML=ic;
  g('EART').classList.toggle('pl',p);
}
function startP(){stopP();prog=setInterval(upProg,300);}
function stopP(){if(prog){clearInterval(prog);prog=null;}}
function upProg(){
  if(!yt||!ytOk)return;
  var c=yt.getCurrentTime()||0,t=yt.getDuration()||0,p=t>0?c/t*100:0;
  tx('CUR',fmt(c));tx('DUR',fmt(t));g('PGFIL').style.width=p+'%';
  tx('ECUR',fmt(c));tx('EDUR',fmt(t));g('EPFIL').style.width=p+'%';
  if(slyr.length)hiLyr(c);
}
function fmt(s){var m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+(x<10?'0':'')+x;}
function g(id){return document.getElementById(id);}
function tx(id,v){var el=g(id);if(el)el.textContent=v;}
function seekBar(e){
  if(!yt||!ytOk)return;
  var r=g('PGBAR').getBoundingClientRect();
  yt.seekTo(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(yt.getDuration()||0),true);
}
function seekEp(e){
  if(!yt||!ytOk)return;
  var r=g('EPBAR').getBoundingClientRect();
  yt.seekTo(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(yt.getDuration()||0),true);
}
function setVol(e){
  var r=g('VOLBAR').getBoundingClientRect();
  vol=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
  g('VOLFIL').style.width=(vol*100)+'%';
  if(yt&&ytOk)yt.setVolume(vol*100);
  muted=false;updVol();
}
function toggleMute(){muted=!muted;if(yt&&ytOk){muted?yt.mute():yt.unMute();}updVol();}
function updVol(){
  g('VOLIC').innerHTML=muted||vol===0
    ?'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>'
    :'<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>';
}
function vid(s){return s.videoId||s.id||'';}
function thumb(s){var v=vid(s);return(s.thumbnails&&s.thumbnails[0]&&s.thumbnails[0].url)||(v?'https://img.youtube.com/vi/'+v+'/mqdefault.jpg':'');}
function arStr(s){if(s.artists&&s.artists.length)return s.artists.map(function(a){return a.name;}).join(', ');return s.subtitle||s.author||(s.channel&&s.channel.name)||'';}

function playSong(i){
  if(!songs[i])return;
  if(!ytOk){toast('Player loading...');setTimeout(function(){playSong(i);},800);return;}
  idx=i;
  var s=songs[i],th=thumb(s),ar=arStr(s),ti=s.title||'Unknown',vi=vid(s);
  if(!vi){toast('No video ID for this track');return;}
  tx('PBTIT',ti);tx('PBART',ar);g('PBT').src=th;
  tx('ETIT',ti);tx('EART2',ar);g('EART').src=th;
  g('PB').classList.add('vis');
  g('npsSidebar').classList.add('show');
  g('npsImg').src=th;tx('npsTitle',ti);tx('npsArt',ar);
  g('PHT').classList.toggle('on',liked.has(vi));
  rQueue();hiActive();
  lyrOk=false;slyr=[];g('LBODY').innerHTML='';g('LWAIT').style.display='block';g('LWAIT').textContent='Loading lyrics...';
  if(expanded){loadLyr(s);loadRel(s);}
  yt.loadVideoById(vi);yt.playVideo();
  dynBg(th);
}
function dynBg(url){
  var img=new Image();img.crossOrigin='anonymous';
  img.onload=function(){
    try{
      var c=document.createElement('canvas');c.width=c.height=1;
      var ctx=c.getContext('2d');ctx.drawImage(img,0,0,1,1);
      var d=ctx.getImageData(0,0,1,1).data;
      g('EP').style.background='linear-gradient(135deg,rgb('+Math.round(d[0]*.3)+','+Math.round(d[1]*.3)+','+Math.round(d[2]*.3)+') 0%,rgb('+Math.round(d[0]*.5)+','+Math.round(d[1]*.5)+','+Math.round(d[2]*.5)+') 50%,#0a0a0a 100%)';
    }catch(x){}
  };img.src=url;
}
function togglePlay(){if(!ytOk)return;playing?yt.pauseVideo():yt.playVideo();}
function prevSong(){
  if(!yt||!ytOk)return;
  if(yt.getCurrentTime()>4){yt.seekTo(0,true);return;}
  var ni=shuf?rnd():Math.max(0,idx-1);
  playSong(ni);
}
function nextSong(){
  if(!songs.length)return;
  if(rep===1&&idx>=0){playSong(idx);return;}
  var ni=shuf?rnd():idx+1;
  if(ni<songs.length)playSong(ni);
  else if(rep===2&&songs.length)playSong(0);
}
function rnd(){var n=Math.floor(Math.random()*songs.length);return n===idx?(n+1)%songs.length:n;}
function toggleShuf(){
  shuf=!shuf;
  [g('PBSH'),g('EPSH')].forEach(function(el){el.classList.toggle('on',shuf);});
  toast(shuf?'Shuffle on':'Shuffle off');
}
function toggleRep(){
  rep=(rep+1)%3;
  [g('PBRP'),g('EPRP')].forEach(function(el){el.classList.toggle('on',rep>0);});
  toast(['Repeat off','Repeat all','Repeat one'][rep]);
}
function toggleLike(){
  var s=songs[idx];if(!s)return;var v=vid(s);
  if(liked.has(v))liked.delete(v);else liked.add(v);
  g('PHT').classList.toggle('on',liked.has(v));
  toast(liked.has(v)?'Liked!':'Removed from liked');
}
function toggleExpand(){
  expanded=!expanded;
  g('EP').classList.toggle('open',expanded);
  if(expanded&&idx>=0&&!lyrOk){loadLyr(songs[idx]);loadRel(songs[idx]);}
}
function hiActive(){document.querySelectorAll('.rr').forEach(function(el,i){el.classList.toggle('on',i===idx);});}

async function loadLyr(s){
  lyrOk=true;slyr=[];
  g('LWAIT').style.display='block';g('LWAIT').textContent='Loading lyrics...';g('LBODY').innerHTML='';
  try{
    var d=await(await fetch('/api/lyrics?title='+encodeURIComponent(s.title||'')+'&artist='+encodeURIComponent(arStr(s)))).json();
    g('LWAIT').style.display='none';
    if(d.success&&d.syncedLyrics){
      slyr=parseLRC(d.syncedLyrics);
      if(slyr.length){g('LBODY').innerHTML='<div class="lc">'+slyr.map(function(l,i){return'<div class="ll" data-i="'+i+'" onclick="seekLyr('+i+')">'+esc(l.text)+'</div>';}).join('')+'</div>';}
      else if(d.plainLyrics){g('LBODY').innerHTML='<div class="lp">'+esc(d.plainLyrics)+'</div>';}
      else{g('LBODY').innerHTML='<div class="lw">No lyrics found</div>';}
    }else if(d.success&&d.plainLyrics){
      g('LBODY').innerHTML='<div class="lp">'+esc(d.plainLyrics)+'</div>';
    }else{g('LBODY').innerHTML='<div class="lw">No lyrics found</div>';}
  }catch(e){g('LWAIT').style.display='none';g('LBODY').innerHTML='<div class="lw">Could not load lyrics</div>';}
}
function parseLRC(txt){
  var r=[];
  txt.split('\n').forEach(function(line){
    var m=line.match(/\[(\d+):(\d+\.?\d*)\](.*)/);
    if(m){var t=parseInt(m[1])*60+parseFloat(m[2]);var x=m[3].trim();if(x)r.push({time:t,text:x});}
  });
  return r;
}
function seekLyr(i){if(yt&&ytOk&&slyr[i])yt.seekTo(slyr[i].time,true);}
function hiLyr(ct){
  var ai=-1;
  for(var i=0;i<slyr.length;i++){if(slyr[i].time<=ct)ai=i;else break;}
  document.querySelectorAll('.ll').forEach(function(el,i){el.classList.toggle('on',i===ai);el.classList.toggle('ps',i<ai);});
  if(ai>=0){var el=document.querySelector('.ll[data-i="'+ai+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
}
async function loadRel(s){
  g('RBODY').innerHTML='<div class="lw">Loading related...</div>';
  try{
    var d=await(await fetch('/api/related/'+vid(s))).json();
    var items=(d.data||d.results||[]).filter(function(x){return vid(x);}).slice(0,20);
    relSongs=items;
    if(!items.length){g('RBODY').innerHTML='<div class="lw">No related found</div>';return;}
    g('RBODY').innerHTML=items.map(function(rs,i){
      return '<div class="qi" onclick="playRel('+i+')">'
        +'<div class="qin">'+(i+1)+'</div>'
        +'<img class="qit2" src="'+thumb(rs)+'">'
        +'<div class="qii"><div class="qit">'+esc(rs.title||'Unknown')+'</div><div class="qis">'+esc(arStr(rs))+'</div></div>'
        +'<div class="qid">'+esc(rs.duration||'')+'</div>'
        +'</div>';
    }).join('');
  }catch(e){g('RBODY').innerHTML='<div class="lw">Could not load related</div>';}
}
function playRel(i){if(!relSongs[i])return;songs=relSongs;playSong(i);renderRes();}
function rQueue(){
  if(!songs.length){g('QBODY').innerHTML='<div class="lw">Queue is empty</div>';return;}
  g('QBODY').innerHTML=songs.map(function(s,i){
    return '<div class="qi'+(i===idx?' on':'')+'\" onclick="playSong('+i+')">'
      +'<div class="qin">'+(i+1)+'</div>'
      +'<img class="qit2" src="'+thumb(s)+'">'
      +'<div class="qii"><div class="qit">'+esc(s.title||'Unknown')+'</div><div class="qis">'+esc(arStr(s))+'</div></div>'
      +'<div class="qid">'+esc(s.duration||'')+'</div>'
      +'</div>';
  }).join('');
}
function dlCurrent(){
  if(dOk||idx<0)return;
  var s=songs[idx],vi=vid(s);if(!vi){toast('No song selected');return;}
  dOk=true;g('DLBTN').classList.add('dl');g('DLBTN').textContent='Downloading...';
  toast('Starting download...');
  var a=document.createElement('a');
  a.href='/api/download?id='+encodeURIComponent(vi)+'&title='+encodeURIComponent(s.title||'audio');
  a.download=(s.title||'audio')+'.webm';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast('Download started!');
  setTimeout(function(){
    dOk=false;g('DLBTN').classList.remove('dl');
    g('DLBTN').innerHTML='<svg viewBox="0 0 24 24" style="width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Download';
  },3000);
}
function dlRow(i){
  var s=songs[i],vi=vid(s);if(!vi)return;
  toast('Downloading...');
  var a=document.createElement('a');
  a.href='/api/download?id='+encodeURIComponent(vi)+'&title='+encodeURIComponent(s.title||'audio');
  a.download=(s.title||'audio')+'.webm';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function shareURL(){var s=songs[idx];if(!s)return;navigator.clipboard.writeText(location.origin+'/api/stream?id='+vid(s)).then(function(){toast('Stream URL copied!');});}
function cpID(){var s=songs[idx];if(!s)return;navigator.clipboard.writeText(vid(s)).then(function(){toast('Video ID copied!');});}
function setTab(btn){
  document.querySelectorAll('.etb').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');
  document.querySelectorAll('.etpan').forEach(function(p){p.classList.remove('on');});
  g('etab-'+btn.dataset.tab).classList.add('on');
  if(btn.dataset.tab==='queue')rQueue();
}
function setNav(name){
  document.querySelectorAll('.ni').forEach(function(n){n.classList.remove('on');});
  var el=g('nav-'+name);if(el)el.classList.add('on');
  document.querySelectorAll('.pane').forEach(function(p){p.classList.remove('show');});
  var pane=g('pane-'+name);if(pane)pane.classList.add('show');
  curNav=name;
  if(name==='discover'&&!discOk)loadDiscover();
  if(name==='charts'&&!chartOk)loadCharts();
  if(name==='api')renderAPI();
}
function setFilter(btn){
  document.querySelectorAll('.fc').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');
  curF=btn.dataset.f;
  if(lastQ)doSearch(lastQ,curF);
}
var sdeb=null;
g('SI').addEventListener('input',function(){
  clearTimeout(sdeb);var q=this.value.trim();
  if(!q){lastQ='';showEmp();return;}
  sdeb=setTimeout(function(){doSearch(q,curF);},500);
});
g('SI').addEventListener('keydown',function(e){
  if(e.key==='Enter'){clearTimeout(sdeb);doSearch(this.value.trim(),curF);}
});
async function doSearch(q,f){
  if(!q)return;lastQ=q;
  setNav('search');
  g('LD').style.display='block';g('RES').innerHTML='';
  try{
    var url='/api/search?q='+encodeURIComponent(q)+'&fallback=1';
    if(f)url+='&filter='+f;
    var d=await(await fetch(url)).json();
    songs=(d.results||[]).map(function(s){if(!s.videoId&&s.id)s.videoId=s.id;return s;});
    renderRes();
  }catch(e){songs=[];renderRes();}
  g('LD').style.display='none';
}
function showEmp(){
  g('RES').innerHTML='<div class="emp"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="7"/><path d="m16 16 5 5"/><path d="M9 6v3h3"/></svg><h3>Find your music</h3><p>Search songs, artists, albums or playlists</p></div>';
}
function renderRes(){
  if(!songs.length){g('RES').innerHTML='<div class="emp"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><h3>No results</h3><p>Try a different search</p></div>';return;}
  g('RES').innerHTML='<div class="rl fu">'+rowsH(songs)+'</div>';
}
function rowsH(list){
  return list.map(function(s,i){
    var type=s.resultType||s.type||'song';
    var th=thumb(s),ar=arStr(s),bid=s.browseId||'';
    var isPl=bid.startsWith('VL')||type==='playlist';
    var isAl=(bid.startsWith('MPRE')&&!isPl)||type==='album';
    var isAr=bid.startsWith('UC')||type==='artist';
    var vi=vid(s);
    var canPlay=!!(vi&&(type==='song'||type==='video'));
    var clk='';
    if(canPlay)clk='playSong('+i+')';
    else if(isPl&&bid)clk="vPl('"+bid+"','"+encodeURIComponent(th)+"','"+encodeURIComponent(s.title||'')+"')";
    else if(isAl&&bid)clk="vAl('"+bid+"','"+encodeURIComponent(th)+"','"+encodeURIComponent(s.title||'')+"')";
    else if(bid)clk="vAr('"+bid+"','"+encodeURIComponent(th)+"','"+encodeURIComponent(s.title||'')+"')";
    var badge=(type!=='song'&&type!=='video')?'<span class="rbg">'+esc(type)+'</span>':'';
    return '<div class="rr'+(i===idx?' on':'')+'\" onclick="'+clk+'">'
      +'<div class="rn">'+(i+1)+'</div>'
      +'<div class="rpl"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></div>'
      +'<img class="rth'+(isAr?' c':'')+'\" src="'+th+'" loading="lazy">'
      +'<div class="ri"><div class="rr-t">'+esc(s.title||s.name||'Unknown')+'</div><div class="rr-s">'+esc(ar||type)+'</div></div>'
      +badge+'<div class="rdu">'+esc(s.duration||'')+'</div>'
      +(canPlay?'<div class="ra"><button class="rb" onclick="event.stopPropagation();dlRow('+i+')" title="Download"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button></div>':'')
      +'</div>';
  }).join('');
}
async function vAr(id,thE,nE){
  var th=decodeURIComponent(thE),name=decodeURIComponent(nE);
  setLd(true);
  try{
    var d=await(await fetch('/api/artists/'+encodeURIComponent(id))).json();
    var tracks=[];
    if(d.topSongs){d.topSongs.forEach(function(s){tracks.push(Object.assign({},s,{resultType:'song',thumbnails:[{url:s.thumbnail||th}]}));});}
    if(d.songs&&d.songs.results){d.songs.results.forEach(function(s){tracks.push(Object.assign({},s,{resultType:'song'}));});}
    if(d.albums){d.albums.forEach(function(a){tracks.push(Object.assign({},a,{resultType:'album',thumbnails:[{url:a.thumbnail||th}]}));});}
    songs=tracks;
    var art=d.artist||d,rt=th||art.thumbnail||'';
    g('RES').innerHTML=eHdr('Artist',name,rt,'',art.subscribers||'',true)+'<div class="rl fu">'+rowsH(tracks)+'</div>';
  }catch(e){setErr('Failed to load artist');}
  setLd(false);
}
async function vAl(id,thE,nE){
  var th=decodeURIComponent(thE),name=decodeURIComponent(nE);
  setLd(true);
  try{
    var d=await(await fetch('/api/albums/'+encodeURIComponent(id))).json();
    var al=d.album||d,alTh=th||al.thumbnail||'',alN=name||al.title||'Album';
    var ar=(d.artist&&d.artist.name)||(al.artists&&al.artists.map(function(a){return a.name;}).join(', '))||'';
    songs=(d.tracks||[]).map(function(t){return Object.assign({},t,{resultType:'song',thumbnails:[{url:alTh}]});});
    g('RES').innerHTML=eHdr('Album',alN,alTh,ar,(al.year||'')+' · '+(al.trackCount||songs.length)+' tracks',false)+'<div class="rl fu">'+rowsH(songs)+'</div>';
  }catch(e){setErr('Failed to load album');}
  setLd(false);
}
async function vPl(id,thE,nE){
  var th=decodeURIComponent(thE),name=decodeURIComponent(nE);
  setLd(true);
  try{
    var pid=id.startsWith('VL')?id.substring(2):id;
    var d=await(await fetch('/api/playlists/'+encodeURIComponent(pid))).json();
    var plTh=th||d.thumbnail||'',plN=name||d.title||'Playlist';
    songs=(d.tracks||[]).map(function(t){return Object.assign({},t,{resultType:'song'});});
    g('RES').innerHTML=eHdr('Playlist',plN,plTh,d.description||'',(d.trackCount||songs.length)+' tracks',false)+'<div class="rl fu">'+rowsH(songs)+'</div>';
  }catch(e){setErr('Failed to load playlist');}
  setLd(false);
}
function eHdr(type,name,th,desc,stat,circle){
  return '<div class="eh"><img class="ea'+(circle?' c':'')+'\" src="'+th+'"><div><div class="ety">'+esc(type)+'</div><div class="en">'+esc(name)+'</div>'+(desc?'<div class="ede">'+esc(desc)+'</div>':'')+(stat?'<div class="est">'+esc(stat)+'</div>':'')+'</div></div>'
    +'<div class="eac"><button class="pfab" onclick="playSong(0)"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg></button><button class="bb" onclick="goBack()">&#8592; Back</button></div>';
}
function goBack(){lastQ?doSearch(lastQ,curF):showEmp();}
function setLd(v){g('LD').style.display=v?'block':'none';if(v)g('RES').innerHTML='';}
function setErr(m){g('RES').innerHTML='<div class="emp"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><h3>Error</h3><p>'+esc(m)+'</p></div>';}
async function loadDiscover(){
  discOk=true;g('pane-discover').innerHTML='<div class="ld" style="display:block"><span></span><span></span><span></span></div>';
  try{
    var d=await(await fetch('/api/home')).json();
    var secs=d.data||d.results||d.content||[];
    var h='<div class="stit">Discover</div>';
    secs.slice(0,4).forEach(function(sec){
      if(sec.title)h+='<div style="font-size:.7rem;text-transform:uppercase;letter-spacing:1px;color:var(--mu);font-weight:700;margin:16px 0 10px">'+esc(sec.title)+'</div>';
      var tr=(sec.contents||[]).filter(function(x){return vid(x)||x.browseId;});
      if(tr.length){var si=songs.length;tr.forEach(function(t,i){t._gi=si+i;});songs=songs.concat(tr);h+='<div class="rl">'+rowsH(tr)+'</div>';}
    });
    g('pane-discover').innerHTML=h||'<div class="emp"><h3>Nothing to discover</h3></div>';
  }catch(e){g('pane-discover').innerHTML='<div class="emp"><h3>Could not load</h3></div>';}
}
async function loadCharts(){
  chartOk=true;g('pane-charts').innerHTML='<div class="ld" style="display:block"><span></span><span></span><span></span></div>';
  try{
    var d=await(await fetch('/api/charts?country=US')).json();
    var tr=d.songs||d.results||d.data||[];
    songs=tr;
    g('pane-charts').innerHTML='<div class="stit">Top Charts</div><div class="rl fu">'+rowsH(tr)+'</div>';
  }catch(e){g('pane-charts').innerHTML='<div class="emp"><h3>Could not load charts</h3></div>';}
}
var apiCfg={
  search:{i:[{n:'q',p:'Query',v:'coldplay'},{n:'filter',p:'Filter (songs/albums/artists)',v:'songs'}],u:'/api/search'},
  stream:{i:[{n:'id',p:'Video ID',v:'dQw4w9WgXcQ'}],u:'/api/stream'},
  download:{i:[{n:'id',p:'Video ID',v:'dQw4w9WgXcQ'},{n:'title',p:'Title',v:'My Song'}],u:'/api/download'},
  lyrics:{i:[{n:'title',p:'Title',v:'Yellow'},{n:'artist',p:'Artist',v:'Coldplay'}],u:'/api/lyrics'},
  song:{i:[{n:'videoId',p:'Video ID',v:'dQw4w9WgXcQ'}],u:'/api/songs/{videoId}'},
  album:{i:[{n:'browseId',p:'Album ID',v:'MPREb_PvMNqFUp1oW'}],u:'/api/albums/{browseId}'},
  artist:{i:[{n:'browseId',p:'Artist ID',v:'UCIaFw5VBEK8qaW6nRpx_qnw'}],u:'/api/artists/{browseId}'},
  playlist:{i:[{n:'playlistId',p:'Playlist ID',v:'RDCLAK5uy_k'}],u:'/api/playlists/{playlistId}'},
  charts:{i:[{n:'country',p:'Country',v:'US'}],u:'/api/charts'},
  related:{i:[{n:'id',p:'Video ID',v:'dQw4w9WgXcQ'}],u:'/api/related/{id}'},
};
var epL=[
  {m:'GET',p:'/api/search',q:'?q=coldplay&filter=songs'},
  {m:'GET',p:'/api/stream',q:'?id=VIDEO_ID'},
  {m:'GET',p:'/api/download',q:'?id=VIDEO_ID&title=Song+Name'},
  {m:'GET',p:'/api/proxy',q:'?url=AUDIO_URL'},
  {m:'GET',p:'/api/lyrics',q:'?title=Yellow&artist=Coldplay'},
  {m:'GET',p:'/api/songs/{videoId}',q:''},
  {m:'GET',p:'/api/albums/{browseId}',q:''},
  {m:'GET',p:'/api/artists/{browseId}',q:''},
  {m:'GET',p:'/api/playlists/{playlistId}',q:''},
  {m:'GET',p:'/api/charts',q:'?country=US'},
  {m:'GET',p:'/api/related/{id}',q:''},
  {m:'GET',p:'/api/home',q:''},
  {m:'GET',p:'/api/music/find',q:'?name=Yellow&artist=Coldplay'},
  {m:'GET',p:'/health',q:''},
];
function renderAPI(){
  var h='<div class="api-wrap"><div class="api-sec"><div class="api-tit">Test Endpoints</div>'
    +'<div class="api-row"><select class="api-sel" id="APIEP" onchange="apiUpI()">'+Object.keys(apiCfg).map(function(k){return'<option>'+k+'</option>';}).join('')+'</select></div>'
    +'<div id="APII" class="api-row"></div>'
    +'<div class="api-url" id="APIU"></div>'
    +'<button class="api-btn" onclick="apiTest()">Send Request</button>'
    +'<div class="api-res" id="APIRES"><pre id="APIPRE"></pre></div></div>'
    +'<div class="api-sec"><div class="api-tit">All Endpoints</div><div class="ep-list">'
    +epL.map(function(ep,i){return'<div class="ep-row"><span class="ep-m">'+ep.m+'</span><span class="ep-p">'+ep.p.replace(/\{([^}]+)\}/g,'<span class="pm">{$1}</span>')+esc(ep.q)+'</span><button class="ep-cp" id="ec'+i+'" onclick="cpEp(\''+ep.p+ep.q+'\',\'ec'+i+'\')"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button></div>';}).join('')
    +'</div></div></div>';
  g('pane-api').innerHTML=h;apiUpI();
}
function apiUpI(){
  var ep=g('APIEP').value,c=apiCfg[ep];
  g('APII').innerHTML=c.i.map(function(x){return'<input class="api-in" id="ai_'+x.n+'" placeholder="'+x.p+'" value="'+x.v+'" oninput="apiUpU()">';}).join('');
  apiUpU();
}
function apiUpU(){
  var ep=g('APIEP').value,c=apiCfg[ep],url=c.u,p=new URLSearchParams();
  c.i.forEach(function(x){var el=g('ai_'+x.n);var v=el?el.value:x.v;if(v){if(url.includes('{'+x.n+'}'))url=url.replace('{'+x.n+'}',encodeURIComponent(v));else p.append(x.n,v);}});
  var qs=p.toString();if(qs)url+='?'+qs;
  g('APIU').textContent='GET '+url;
}
async function apiTest(){
  var ep=g('APIEP').value,c=apiCfg[ep],url=c.u,p=new URLSearchParams();
  c.i.forEach(function(x){var el=g('ai_'+x.n);var v=el?el.value:x.v;if(v){if(url.includes('{'+x.n+'}'))url=url.replace('{'+x.n+'}',encodeURIComponent(v));else p.append(x.n,v);}});
  var qs=p.toString();if(qs)url+='?'+qs;
  g('APIRES').style.display='block';g('APIPRE').textContent='Loading...';
  if(ep==='download'){toast('Download triggered');var a=document.createElement('a');a.href=url;document.body.appendChild(a);a.click();document.body.removeChild(a);g('APIPRE').textContent='Download triggered.';return;}
  try{var d=await(await fetch(url)).json();g('APIPRE').textContent=JSON.stringify(d,null,2);}
  catch(e){g('APIPRE').textContent='Error: '+e.message;}
}
function cpEp(path,id){
  navigator.clipboard.writeText(location.origin+path).then(function(){var el=g(id);el.classList.add('ok');setTimeout(function(){el.classList.remove('ok');},2000);});
}
function toast(msg){
  var t=g('TOAST');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2500);
}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
window.onerror=function(){return true;};
window.onunhandledrejection=function(e){e.preventDefault();};
</script>
